<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Agent Testing UI</title>
    <script src="pf_api_integration.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .token-panel {
            display: grid;
            gap: 15px;
        }

        .token-status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .token-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .token-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .token-status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
            flex: 1;
            min-width: 200px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .chat-container {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 600px;
            gap: 20px;
        }

        .messages-area {
            overflow-y: auto;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 10px;
            max-width: 80%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .message.agent {
            background: white;
            border: 2px solid #e0e0e0;
            align-self: flex-start;
        }

        .message .timestamp {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
        }

        .message .agent-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .message .response-text {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message .metadata {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-size: 0.85em;
            opacity: 0.8;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-indicator {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading-indicator.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .clear-btn {
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
        }

        .clear-btn:hover {
            background: #c82333;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .session-info {
            font-size: 0.9em;
            color: #666;
            background: #f8f9ff;
            padding: 8px 15px;
            border-radius: 6px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 Bedrock Agent Testing UI</h1>
            <div class="subtitle">Test your AWS Bedrock Agents with real ProjectForce API integration</div>
        </div>

        <!-- Token Management Panel -->
        <div class="panel token-panel">
            <h2>🔐 ProjectForce API Token</h2>

            <div id="token-status" class="token-status"></div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="openTokenGetter()">
                    🌐 Get Token from Browser
                </button>
                <button class="btn btn-secondary" onclick="checkToken()">
                    🔄 Check Token Status
                </button>
                <button class="btn btn-success" onclick="testPFAPI()">
                    ✅ Test API Connection
                </button>
            </div>
        </div>

        <!-- Chat Interface Panel -->
        <div class="panel">
            <div class="chat-header">
                <h2>💬 Chat with Agent</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="session-info" id="session-info">Session: Not Started</div>
                    <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
                </div>
            </div>

            <div class="chat-container">
                <div class="messages-area" id="messages-area">
                    <div class="empty-state">
                        <div class="empty-state-icon">💭</div>
                        <div>Start a conversation with your Bedrock Agent</div>
                        <div style="margin-top: 10px; color: #ccc;">Type a message below and press Send</div>
                    </div>
                </div>

                <div class="loading-indicator" id="loading-indicator">
                    <div class="spinner"></div>
                    <div>Agent is thinking...</div>
                </div>

                <div class="input-area">
                    <input
                        type="text"
                        class="message-input"
                        id="message-input"
                        placeholder="Type your message here..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const BACKEND_URL = 'http://localhost:5001';
        window.BACKEND_URL = BACKEND_URL; // Expose to other scripts
        let sessionId = null;
        let messageHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkToken();
            sessionId = 'session-' + Date.now();
            document.getElementById('session-info').textContent = `Session: ${sessionId}`;
        });

        // ========================================
        // Token Management
        // ========================================

        function openTokenGetter() {
            const tokenGetterPath = window.location.pathname.replace('/testing/ui/test_ui.html', '/get_token_from_browser.html');
            const tokenGetterUrl = window.location.origin + tokenGetterPath;
            window.open(tokenGetterUrl, 'tokenGetter', 'width=900,height=700');

            showTokenStatus('info', `
                ℹ️ Token getter window opened!<br>
                <small>Use it to log in and get your token, then come back here and click "Check Token Status"</small>
            `);
        }

        function checkToken() {
            const token = localStorage.getItem('pf_access_token');
            const clientId = localStorage.getItem('pf_client_id');
            const userId = localStorage.getItem('pf_user_id');

            if (!token) {
                showTokenStatus('error', `
                    ❌ No token found in localStorage<br>
                    <small>Please use "Get Token from Browser" first</small>
                `);
                return;
            }

            showTokenStatus('success', `
                ✅ Token loaded successfully!<br>
                Client ID: ${clientId || '09PF05VD'}<br>
                User ID: ${userId || '1645869'}<br>
                Token: ${token.substring(0, 50)}...<br>
                <small>You can now test the Bedrock agents below</small>
            `);
        }

        async function testPFAPI() {
            showTokenStatus('info', '🔄 Testing connection through backend...');

            try {
                const result = await window.ProjectForceAPI.testConnection();

                if (result.success) {
                    showTokenStatus('success', `
                        ✅ Connection Successful!<br>
                        Client ID: ${result.clientId}<br>
                        Backend: Working ✓<br>
                        Token: Valid ✓<br>
                        <small>You can now chat with the Bedrock agents using real data</small>
                    `);
                } else {
                    showTokenStatus('error', `
                        ❌ Connection Failed<br>
                        ${result.message}<br>
                        <small>Please get/regenerate a fresh token or check if backend is running</small>
                    `);
                }
            } catch (error) {
                showTokenStatus('error', `
                    ❌ Error: ${error.message}<br>
                    <small>Make sure the backend server is running on localhost:5001</small>
                `);
            }
        }

        function showTokenStatus(type, message) {
            const statusDiv = document.getElementById('token-status');
            statusDiv.className = `token-status ${type}`;
            statusDiv.innerHTML = message;
        }

        // ========================================
        // Chat Functions
        // ========================================

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) {
                return;
            }

            // Check token
            const token = localStorage.getItem('pf_access_token');
            if (!token) {
                alert('Please get a token first using the "Get Token from Browser" button above');
                return;
            }

            // Disable input
            input.disabled = true;
            document.getElementById('send-btn').disabled = true;
            document.getElementById('loading-indicator').classList.add('active');

            // Add user message to chat
            addMessage('user', message);
            input.value = '';

            try {
                const pfClientId = localStorage.getItem('pf_client_id') || '09PF05VD';
                const pfUserId = localStorage.getItem('pf_user_id') || '1645869';

                const response = await fetch(`${BACKEND_URL}/api/classify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        pf_token: token,
                        pf_client_id: pfClientId,
                        pf_user_id: pfUserId,
                        session_id: sessionId
                    })
                });

                const result = await response.json();

                // Add agent response to chat
                addMessage('agent', result.response, {
                    intent: result.intent,
                    agent_id: result.agent_id,
                    classification_time: result.classification_time_ms,
                    invocation_time: result.invocation_time_ms,
                    total_time: result.total_time_ms
                });

            } catch (error) {
                console.error('Error:', error);
                addMessage('agent', `❌ Error: ${error.message}`, { error: true });
            } finally {
                // Re-enable input
                input.disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('loading-indicator').classList.remove('active');
                input.focus();
            }
        }

        function addMessage(type, content, metadata = null) {
            const messagesArea = document.getElementById('messages-area');

            // Remove empty state if present
            const emptyState = messagesArea.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const timestamp = new Date().toLocaleTimeString();

            let html = '';

            if (type === 'agent' && metadata && !metadata.error) {
                html += `<div class="agent-name">🤖 ${getAgentName(metadata.intent)}</div>`;
            }

            html += `<div class="response-text">${content}</div>`;

            if (metadata && !metadata.error) {
                html += `<div class="metadata">`;
                if (metadata.intent) html += `Intent: ${metadata.intent} | `;
                if (metadata.classification_time) html += `Classification: ${metadata.classification_time}ms | `;
                if (metadata.invocation_time) html += `Invocation: ${metadata.invocation_time}ms | `;
                if (metadata.total_time) html += `Total: ${metadata.total_time}ms`;
                html += `</div>`;
            }

            html += `<div class="timestamp">${timestamp}</div>`;

            messageDiv.innerHTML = html;
            messagesArea.appendChild(messageDiv);

            // Scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;

            // Store in history
            messageHistory.push({ type, content, metadata, timestamp });
        }

        function getAgentName(intent) {
            const agentNames = {
                'scheduling': 'Scheduling Agent',
                'information': 'Information Agent',
                'notes': 'Notes Agent',
                'chitchat': 'Chitchat Agent'
            };
            return agentNames[intent] || 'Agent';
        }

        function clearChat() {
            if (!confirm('Clear all messages?')) return;

            const messagesArea = document.getElementById('messages-area');
            messagesArea.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <div>Start a conversation with your Bedrock Agent</div>
                    <div style="margin-top: 10px; color: #ccc;">Type a message below and press Send</div>
                </div>
            `;

            messageHistory = [];
            sessionId = 'session-' + Date.now();
            document.getElementById('session-info').textContent = `Session: ${sessionId}`;
        }
    </script>
</body>
</html>
